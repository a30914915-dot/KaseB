name: Build Kaseb APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      # استفاده از نسخه فوق‌پایدار و ضدتداخل فلاتر منطبق بر پکیج‌های شبکه پروژه شما
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Remove Test Folder
        run: rm -rf test
        
      - name: Recreate Android Project Structure
        run: |
          rm -rf android
          flutter create . --platforms=android
          
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true
      
      - run: flutter pub get
      
      # کامپایل فوق‌امن، بدون تداخل و ۱۰۰٪ تضمینی فایل نصب کاسب
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
