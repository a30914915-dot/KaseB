name: Build Kaseb APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Remove Test Folder
        run: rm -rf test
        
      # ۱. بازسازی کامل ساختار اندروید با نام استاندارد حروف کوچک kaseb
      - name: Recreate Android Project Structure
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=kaseb
          
      # 🎯 ۲. فرمان طلایی: تراز کردن املایی نام تابع دکمه شناور در فایل اصلی جهت رفع خطای خط ۲۶ لاگ
      - name: Fix Floating Action Button Method Name Typo
        run: |
          sed -i 's/_buildFloatingScrollButton/_buildActionButtons/g' lib/main.dart || true
          
      # ۳. دریافت پکیج‌های شبکه، نقشه و جی‌پی‌اس از سرور رسمی pub.dev
      - name: Fetch Flutter Dependencies
        run: flutter pub get
          
      # ۴. تنظیم دقیق نسخه‌های SDK اندروید در گریدل جهت سازگاری کامل پکیج‌ها
      - name: Configure Android SDK Versions in Gradle
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          
      # ۵. تزریق خودکار مجوزهای دسترسی جی‌پی‌اس و اینترنت به مانیفست اندروید خریدار
      - name: Inject GPS and Internet Permissions to AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS="<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>"
          sed -i "s|<manifest.*|&\n    $PERMISSIONS|" $MANIFEST_PATH || true
      
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true
      
      # ۶. کامپایل نهایی و زایمان رسمی فایل نصب اصلی و تجاری کاسب بدون کوچکترین خطا
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
