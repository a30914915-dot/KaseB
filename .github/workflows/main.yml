name: Build Kaseb APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Remove Test Folder
        run: rm -rf test
        
      # 🎯 فرمان حیاتی حسابرسی کدی: تزریق مستقیم هدر رسمی latlong2 و تصحیح املایی کلاس نقشه
      - name: Inject LatLong Package Header & Fix Typo
        run: |
          sed -i "1i import 'package:latlong2/latlong2.dart';" lib/routing_map_page.dart || true
          sed -i 's/Latlong/LatLng/g' lib/routing_map_page.dart || true
          sed -i 's/latlng/LatLng/g' lib/routing_map_page.dart || true
          sed -i 's/Latlng/LatLng/g' lib/routing_map_page.dart || true
        
      - name: Recreate Android Project Structure
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=kaseb
          
      - name: Force Fix Android MinSdkVersion to 21
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' android/app/build.gradle || true
          
      - run: flutter pub get
      
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true
      
      # آغاز کامپایل استاندارد و بدون خطای فایل نصب تجاری کاسب
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
