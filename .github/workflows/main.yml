name: Build Kaseb APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Remove Test Folder
        run: rm -rf test
        
      # پاکسازی و بازسازی کامل ساختار با نام کوچک استاندارد
      - name: Recreate Android Project Structure
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=kaseb
          
      # 🎯 فرمان حیاتی و حسابرسی فنی: ارتقای خودکار حداقل نسخه اندروید به ۲۱ جهت سازگاری کامل با پکیج نقشه و جی‌پی‌اس
      - name: Upgrade Android minSdkVersion for GPS & Maps
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          
      - run: flutter pub get
      
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true
      
      # کامپایل بدون خطا و زایمان نهایی فایل نصب تجاری کاسب
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
