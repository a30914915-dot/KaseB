name: Build Kaseb APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          
      # حذف پوشه تست جهت جلوگیری از خطای ویجت‌ها
      - name: Remove Test Folder
        run: rm -rf test
        
      # پاکسازی و بازسازی کامل ساختار اندروید منطبق با سرور
      - name: Recreate Android Project Structure
        run: |
          rm -rf android
          flutter create . --platforms=android
          
      - run: flutter pub get
      
      # 🎯 دستور طلایی: تایید و امضای الکترونیکی تمام لایسنس‌های اندروید در سرور گیت‌هاب
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true
      
      # کامپایل استاندارد و خروجی نهایی بدون محدودیت حجم کد
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
