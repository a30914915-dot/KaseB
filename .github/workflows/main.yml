name: Build Kaseb APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Remove Test Folder
        run: rm -rf test
        
      # ۱. بازسازی کامل پلتفرم اندروید با حروف کوچک kaseb
      - name: Recreate Android Project Structure
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=kaseb
          
      # ۲. 🎯 اقدام اول تحلیل: ثبت صریح، اجباری و دانلود مستقیم پکیج latlong2 و بقیه وابستگی‌ها
      - name: Force Add Essential Packages
        run: |
          flutter pub add latlong2 flutter_map geolocator device_info_plus image_picker http
          
      # ۳. 🎯 اقدام دوم تحلیل: پاک‌سازی عمیق کش بیلد قبلی سرور
      - name: Clean Flutter Build Cache
        run: flutter clean
        
      # ۴. دریافت مجدد و تراز نهایی پکیج‌ها از مخزن رسمی pub.dev
      - name: Fetch Clean Dependencies
        run: flutter pub get

      # ۵. تنظیم دقیق نسخه‌های SDK اندروید در گریدل جهت سازگاری کامل پکیج‌ها
      - name: Configure Android SDK Versions in Gradle
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          
      # ۶. 🎯 اقدام سوم تحلیل: تزریق خودکار مجوزهای دسترسی جی‌پی‌اس و اینترنت به مانیفست اندروید
      - name: Inject GPS and Internet Permissions to AndroidManifest
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS="<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>"
          sed -i "s|<manifest.*|&\n    $PERMISSIONS|" $MANIFEST_PATH || true
      
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true
      
      # ۷. کامپایل بدون خطا و خروجی نهایی سند تجاری فایل نصب کاسب روی سرور مایکروسافت
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
