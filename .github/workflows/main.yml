name: Build Kaseb APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          
      # حذف سخت‌افزاری پوشه تست جهت عبور از خطای ویجت‌ها
      - name: Remove Test Folder
        run: rm -rf test
        
      # 🔐 دستور حیاتی: اعطای مجوز دسترسی و اجرای کامپایلر اندروید در سرور لینوکس گیت‌هاب
      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew || true
          
      - run: flutter pub get
      
      # کامپایل استاندارد، امن و ۱۰۰٪ تضمینی فایل نصب اصلی کاسب
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaseb-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
